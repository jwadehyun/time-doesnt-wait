app:
  version: 0.1.0

spring:
  application:
    name: time-doesnt-wait-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/timedoesntwait}
    username: ${DATABASE_USER:timedoesntwait}
    password: ${DATABASE_PASSWORD:timedoesntwait}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
