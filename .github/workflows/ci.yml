name: CI

on:
  push:
  pull_request:

jobs:
  android:
    name: Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (shared domain + database)
        run: ./gradlew :shared:jvmTest
      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: time-doesnt-wait-debug-apk
          path: app/androidApp/build/outputs/apk/debug/*.apk

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests (Testcontainers PostgreSQL)
        run: ./gradlew test
      - name: Build Docker image
        run: docker build -t time-doesnt-wait-api:ci .
